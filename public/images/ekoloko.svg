<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768" role="img" aria-label="Ekoloko hub world">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08222c"/>
      <stop offset="0.45" stop-color="#12505f"/>
      <stop offset="1" stop-color="#2d8f8d"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffcf6b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed44f"/>
      <stop offset="0.6" stop-color="#5fae35"/>
      <stop offset="1" stop-color="#3f7f26"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6440"/>
      <stop offset="0.5" stop-color="#5d4229"/>
      <stop offset="1" stop-color="#2e2116"/>
    </linearGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff3ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#bff3ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="roofA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8f6b"/><stop offset="1" stop-color="#d94f3d"/>
    </linearGradient>
    <linearGradient id="roofB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fd8e8"/><stop offset="1" stop-color="#2b8fa8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1418" stop-opacity="0.94"/><stop offset="1" stop-color="#060c0f" stop-opacity="0.94"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.16"/>
    </pattern>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>

    <g id="tree">
      <rect x="-5" y="6" width="10" height="30" rx="4" fill="#6b4a2c"/>
      <circle cx="0" cy="-6" r="26" fill="#3f8f2c"/>
      <circle cx="-15" cy="4" r="19" fill="#4fa336"/>
      <circle cx="15" cy="4" r="19" fill="#4fa336"/>
      <circle cx="-6" cy="-14" r="14" fill="#69c044" opacity="0.85"/>
    </g>
    <g id="house">
      <rect x="-46" y="-16" width="92" height="58" rx="12" fill="#f6e7c9"/>
      <rect x="-46" y="-16" width="92" height="58" rx="12" fill="#000" opacity="0.05"/>
      <path d="M-58 -12 Q0 -66 58 -12 Q0 -30 -58 -12 Z" fill="url(#roofA)"/>
      <rect x="-13" y="10" width="26" height="32" rx="10" fill="#7a4a2c"/>
      <circle cx="6" cy="27" r="2.6" fill="#ffd98a"/>
      <rect x="-38" y="-2" width="18" height="16" rx="5" fill="#8fdcea"/>
      <rect x="20" y="-2" width="18" height="16" rx="5" fill="#8fdcea"/>
    </g>
    <g id="houseB">
      <rect x="-40" y="-14" width="80" height="52" rx="11" fill="#efe0d0"/>
      <path d="M-52 -10 Q0 -60 52 -10 Q0 -26 -52 -10 Z" fill="url(#roofB)"/>
      <rect x="-11" y="10" width="22" height="28" rx="9" fill="#6b4a2c"/>
      <rect x="-32" y="-2" width="15" height="14" rx="4" fill="#8fdcea"/>
