    <rect x="24" y="22" width="286" height="76" rx="12" fill="url(#panel)" stroke="#2c4a52" stroke-width="2"/>
    <circle cx="66" cy="60" r="26" fill="#13262c" stroke="#4af626" stroke-width="2"/>
    <circle cx="66" cy="54" r="11" fill="#f0c39a"/>
    <path d="M48 78 Q66 62 84 78 Z" fill="#3f7fd6"/>
    <rect x="104" y="38" width="120" height="10" rx="5" fill="#dff5e6" opacity="0.85"/>
    <rect x="104" y="56" width="176" height="10" rx="5" fill="#1b2c33"/>
    <rect x="104" y="56" width="132" height="10" rx="5" fill="#4af626"/>
    <rect x="104" y="72" width="176" height="8" rx="4" fill="#1b2c33"/>
    <rect x="104" y="72" width="96" height="8" rx="4" fill="#54c8e0"/>
