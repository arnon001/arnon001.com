    <ellipse cx="250" cy="104" rx="80" ry="26"/>
    <ellipse cx="620" cy="76" rx="140" ry="26"/>
    <ellipse cx="900" cy="250" rx="110" ry="24"/>
    <ellipse cx="90" cy="290" rx="90" ry="20"/>
  </g>

  <!-- distant islets -->
  <g opacity="0.5">
    <ellipse cx="120" cy="230" rx="70" ry="18" fill="#4f9c6a"/>
    <path d="M52 232 Q70 288 120 300 Q170 288 188 232 Q120 254 52 232 Z" fill="#3a4a3a"/>
    <ellipse cx="930" cy="380" rx="58" ry="15" fill="#4f9c6a"/>
    <path d="M874 382 Q890 428 930 438 Q970 428 986 382 Q930 400 874 382 Z" fill="#3a4a3a"/>
  </g>

  <!-- main island -->
  <path d="M148 424 Q166 556 300 620 Q424 676 508 742 Q592 676 716 620 Q850 556 872 424 Q700 502 512 502 Q324 502 148 424 Z" fill="url(#rock)"/>
  <g fill="#2a1d13" opacity="0.45">
    <path d="M300 560 l26 44 -34 10 z"/>
    <path d="M660 566 l30 40 -40 12 z"/>
    <path d="M470 640 l22 40 -30 6 z"/>
  </g>
  <ellipse cx="512" cy="436" rx="366" ry="126" fill="#d9c48f"/>
  <ellipse cx="512" cy="424" rx="366" ry="126" fill="url(#grass)"/>
  <ellipse cx="512" cy="410" rx="316" ry="100" fill="#79c745" opacity="0.45"/>

  <!-- winding path -->
  <path d="M250 470 Q360 430 470 452 Q590 476 700 430 Q770 402 820 412" stroke="#e0cda1" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M250 470 Q360 430 470 452 Q590 476 700 430 Q770 402 820 412" stroke="#c9b489" stroke-width="34" fill="none" stroke-linecap="round" stroke-dasharray="4 26" opacity="0.6"/>
  <path d="M470 452 Q480 392 520 350" stroke="#e0cda1" stroke-width="24" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- pond -->
  <ellipse cx="640" cy="486" rx="76" ry="30" fill="#2f9fc4"/>
  <ellipse cx="640" cy="482" rx="76" ry="30" fill="#54c8e0"/>
  <ellipse cx="620" cy="476" rx="30" ry="9" fill="#bff0f5" opacity="0.5"/>

  <!-- waterfall -->
  <path d="M232 452 Q222 560 236 660 Q244 706 228 742 L268 742 Q258 700 268 660 Q282 560 272 452 Z" fill="url(#fall)"/>
  <g fill="#dff8ff" opacity="0.35">
    <ellipse cx="248" cy="748" rx="56" ry="14"/>
    <ellipse cx="248" cy="736" rx="34" ry="10"/>
