    <rect x="842" y="210" width="144" height="7" rx="3.5" fill="#7d9aa3" opacity="0.7"/>
    <rect x="842" y="224" width="120" height="7" rx="3.5" fill="#7d9aa3" opacity="0.5"/>
    <rect x="842" y="244" width="144" height="8" rx="4" fill="#1b2c33"/>
    <rect x="842" y="244" width="60" height="8" rx="4" fill="#4af626"/>
  </g>

  <!-- chat -->
  <g>
    <rect x="24" y="560" width="330" height="150" rx="12" fill="url(#panel)" stroke="#2c4a52" stroke-width="2"/>
    <g opacity="0.85">
      <rect x="40" y="578" width="52" height="8" rx="4" fill="#8dff6a"/>
      <rect x="100" y="578" width="180" height="8" rx="4" fill="#9fb8bf" opacity="0.6"/>
      <rect x="40" y="598" width="44" height="8" rx="4" fill="#ffd166"/>
      <rect x="92" y="598" width="212" height="8" rx="4" fill="#9fb8bf" opacity="0.6"/>
      <rect x="40" y="618" width="60" height="8" rx="4" fill="#6fd8e8"/>
      <rect x="108" y="618" width="146" height="8" rx="4" fill="#9fb8bf" opacity="0.6"/>
      <rect x="40" y="638" width="48" height="8" rx="4" fill="#ff8fb1"/>
      <rect x="96" y="638" width="190" height="8" rx="4" fill="#9fb8bf" opacity="0.6"/>
    </g>
    <rect x="40" y="666" width="298" height="28" rx="8" fill="#0a1418" stroke="#2c4a52" stroke-width="1.5"/>
    <rect x="52" y="677" width="120" height="7" rx="3.5" fill="#4a656d"/>
    <rect x="316" y="674" width="3" height="14" fill="#4af626">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- hotbar -->
  <g>
    <rect x="378" y="646" width="512" height="76" rx="14" fill="url(#panel)" stroke="#2c4a52" stroke-width="2"/>
    <g>
      <use href="#slot" x="422" y="684"/><circle cx="422" cy="684" r="12" fill="#ff8f6b"/>
      <use href="#slot" x="482" y="684"/><path d="M472 690 l10 -16 10 16 z" fill="#ffcf3f"/>
      <use href="#slot" x="542" y="684"/><circle cx="542" cy="684" r="12" fill="#54c8e0"/>
      <use href="#slot" x="602" y="684"/><rect x="592" y="674" width="20" height="20" rx="5" fill="#8dff6a"/>
      <use href="#slot" x="662" y="684"/><path d="M652 684 h20 M662 674 v20" stroke="#e86fa8" stroke-width="5" stroke-linecap="round"/>
      <use href="#slot" x="722" y="684"/><circle cx="722" cy="684" r="12" fill="#c0a3ff"/>
      <use href="#slot" x="782" y="684"/><path d="M772 692 q10 -22 20 0 z" fill="#f6e7c9"/>
      <use href="#slot" x="842" y="684"/><rect x="833" y="675" width="18" height="18" rx="4" fill="#7d9aa3"/>
    </g>
    <circle cx="542" cy="684" r="25" fill="none" stroke="#4af626" stroke-width="2.5"/>
  </g>

  <!-- menu buttons -->
  <g>
    <rect x="906" y="646" width="88" height="76" rx="14" fill="url(#panel)" stroke="#2c4a52" stroke-width="2"/>
    <circle cx="950" cy="676" r="15" fill="none" stroke="#8dff6a" stroke-width="3"/>
    <path d="M950 668 v9 M950 684 h0.1" stroke="#8dff6a" stroke-width="3" stroke-linecap="round"/>
    <rect x="926" y="700" width="48" height="7" rx="3.5" fill="#4a656d"/>
