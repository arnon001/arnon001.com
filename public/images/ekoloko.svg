    <rect x="444" y="394.5" width="34" height="4" rx="2" fill="#8dff6a"/>
    <rect x="506" y="416" width="60" height="9" rx="4.5" fill="#08131a" opacity="0.7"/>
    <rect x="510" y="418.5" width="42" height="4" rx="2" fill="#ffd166"/>
  </g>

