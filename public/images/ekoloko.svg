  <rect width="1024" height="768" fill="url(#sky)"/>
  <circle cx="812" cy="132" r="200" fill="url(#sun)"/>
  <circle cx="812" cy="132" r="42" fill="#ffe6a3" opacity="0.9"/>

  <g fill="#bff0f5" opacity="0.16">
