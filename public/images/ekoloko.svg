  <use href="#houseB" x="288" y="392" transform="translate(288 392) scale(0.78) translate(-288 -392)"/>

  <use href="#tree" x="222" y="380"/>
  <use href="#tree" x="330" y="330" transform="translate(330 330) scale(0.85) translate(-330 -330)"/>
  <use href="#tree" x="640" y="300" transform="translate(640 300) scale(0.9) translate(-640 -300)"/>
  <use href="#tree" x="820" y="356"/>
  <use href="#tree" x="700" y="510" transform="translate(700 510) scale(0.8) translate(-700 -510)"/>
  <use href="#tree" x="360" y="500" transform="translate(360 500) scale(0.75) translate(-360 -500)"/>

  <g fill="#f7e9a8" opacity="0.9">
    <circle cx="430" cy="486" r="4"/><circle cx="452" cy="498" r="3.4"/><circle cx="596" cy="410" r="3.6"/>
    <circle cx="308" cy="440" r="3.4"/><circle cx="770" cy="452" r="4"/>
  </g>
  <g fill="#ff8fb1" opacity="0.85">
    <circle cx="470" cy="510" r="3.6"/><circle cx="676" cy="440" r="3.2"/><circle cx="252" cy="416" r="3.4"/>
  </g>

  <use href="#quest" x="556" y="286"/>
