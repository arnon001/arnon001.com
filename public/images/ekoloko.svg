      <path d="M-13 8 Q0 -2 13 8 L15 28 Q0 33 -15 28 Z" fill="#3f7fd6"/>
      <circle cx="0" cy="-6" r="14" fill="#f0c39a"/>
      <path d="M-14 -9 Q0 -25 14 -9 Q0 -16 -14 -9 Z" fill="#4a3226"/>
      <circle cx="-5" cy="-5" r="1.9" fill="#221a14"/>
      <circle cx="5" cy="-5" r="1.9" fill="#221a14"/>
      <path d="M-4 1 Q0 4 4 1" stroke="#b5765a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
    <g id="avatarPink">
      <ellipse cx="0" cy="30" rx="17" ry="5" fill="#000" opacity="0.22"/>
      <path d="M-13 8 Q0 -2 13 8 L15 28 Q0 33 -15 28 Z" fill="#e86fa8"/>
      <circle cx="0" cy="-6" r="14" fill="#f6d3b0"/>
      <path d="M-15 -6 Q-16 -24 0 -24 Q16 -24 15 -6 Q10 -18 0 -18 Q-10 -18 -15 -6 Z" fill="#8a4a2c"/>
      <circle cx="-5" cy="-5" r="1.9" fill="#221a14"/>
      <circle cx="5" cy="-5" r="1.9" fill="#221a14"/>
      <path d="M-4 1 Q0 4 4 1" stroke="#c07a5e" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
    <g id="quest">
      <path d="M0 -34 L18 -12 L0 6 L-18 -12 Z" fill="#ffcf3f" stroke="#a8761a" stroke-width="2"/>
      <rect x="-3" y="-26" width="6" height="14" rx="3" fill="#5a3d05"/>
      <circle cx="0" cy="-7" r="3" fill="#5a3d05"/>
    </g>
    <g id="slot">
      <circle r="25" fill="#0d1a1f" stroke="#2c4a52" stroke-width="2"/>
      <circle r="21" fill="#13262c"/>
    </g>
