    <circle cx="348" cy="40" r="11" fill="#ffcf3f" stroke="#a8761a" stroke-width="2"/>
    <rect x="368" y="34" width="72" height="11" rx="5.5" fill="#dff5e6" opacity="0.7"/>
  </g>

  <!-- minimap -->
