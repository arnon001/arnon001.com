    <circle cx="934" cy="86" r="66" fill="url(#panel)" stroke="#2c4a52" stroke-width="2"/>
    <circle cx="934" cy="86" r="56" fill="#123a3a"/>
    <ellipse cx="934" cy="90" rx="40" ry="28" fill="#4f9c35"/>
    <path d="M900 96 Q930 82 968 92" stroke="#e0cda1" stroke-width="5" fill="none"/>
    <circle cx="920" cy="80" r="4" fill="#ff8f6b"/>
    <circle cx="950" cy="98" r="4" fill="#6fd8e8"/>
    <circle cx="934" cy="90" r="5" fill="#4af626"/>
    <circle cx="934" cy="90" r="9" fill="none" stroke="#4af626" stroke-width="1.5" opacity="0.6"/>
    <path d="M934 20 l6 12 h-12 z" fill="#8dff6a"/>
