<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <!--seo-->
    <meta name="robots" content="index, follow">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/images/icon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap"></noscript>
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          var l = localStorage.getItem('arnon.lang');
          if (l !== 'en' && l !== 'he') l = (navigator.language || 'en').toLowerCase().indexOf('he') === 0 ? 'he' : 'en';
          d.lang = l;
          d.dir = l === 'he' ? 'rtl' : 'ltr';
          if (l === 'he') d.classList.add('lang-pending');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="fx" aria-hidden="true">
      <div class="fx-grid"></div>
      <div class="fx-glow"></div>
      <div class="fx-grain"></div>
      <div class="fx-scan"></div>
      <div class="fx-vignette"></div>
    </div>

    <div id="app"><!--app--></div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
